name: CI/CD

on:
  push:
    branches:
      - main
      - release
      - "feature/**"

  pull_request:
    branches:
      - main
      - release

permissions:
  id-token: write
  contents: read

# Common AWS configuration from GitHub Organization Variables
# Application-specific configuration from Repository Variables
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}

jobs:

  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  # ============================================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  build-and-push:
    name: Build and Push Docker Image
    needs: test

    # Do not build or push images for pull requests
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS OIDC LOGIN
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # ECR LOGIN
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # DOCKER BUILD
      # --------------------------------------------------------
      - name: Build Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building image:"
          echo "$IMAGE"

          docker build -t "$IMAGE" .

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # DOCKER PUSH
      # --------------------------------------------------------
      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Pushing image:"
          echo "$IMAGE"

          docker push "$IMAGE"


  # ============================================================
  # 3. DEPLOY TO ECS
  # ============================================================
  deploy:
    name: Deploy to ECS
    needs: build-and-push

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS OIDC LOGIN
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # DOWNLOAD CURRENT ECS TASK DEFINITION
      # --------------------------------------------------------
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json

          echo "Current task definition downloaded."

      # --------------------------------------------------------
      # UPDATE IMAGE IN TASK DEFINITION
      # --------------------------------------------------------
      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ needs.build-and-push.outputs.image }}

      # --------------------------------------------------------
      # DEPLOY TASK DEFINITION TO ECS
      # --------------------------------------------------------
      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true